name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --console --name Autoplit --collect-all cv2 --collect-all pydirectinput autopilot.py
      - name: Publish direct EXE download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autoplit-build-${{ github.run_number }}
          name: Autoplit Windows Build ${{ github.run_number }}
          files: dist/Autoplit.exe
          make_latest: true
